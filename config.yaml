# HR Model Pipeline Configuration
# ================================
# This configuration file controls all aspects of the heart rate prediction pipeline
# from data loading through model training and evaluation

# Data Configuration
# ------------------
data:
  # Directory containing GPX files for training
  gpx_dir: gpx
  
  # Pattern for model-specific output directories
  # {model_name} will be replaced with actual model names (e.g., random_forest)
  model_output_pattern: output/{model_name}
  
  # Main output directory for all results
  output_dir: output
  
  # Directory for processed feature-engineered data
  processed_data_dir: output/processed_data

# Evaluation Configuration
# ------------------------
evaluation:
  # Whether to create visualization plots (set to false for faster runs)
  create_plots: true
  
  # Metrics to calculate for model evaluation
  # MAE: Mean Absolute Error (average prediction error in bpm)
  # RMSE: Root Mean Square Error (penalizes large errors more)
  # MAPE: Mean Absolute Percentage Error (relative error)
  # R2: R-squared (proportion of variance explained)
  # Correlation: Pearson correlation between predicted and actual
  metrics:
  - mae
  - rmse
  - mape
  - r2
  - correlation
  
  # Primary metric for model selection (used for ranking models)
  primary_metric: mae
  
  # Whether to save predictions to parquet files
  save_predictions: true

# Feature Engineering Configuration
# ---------------------------------
features:
  # Whether to add derived features (gradients, lags, variability, etc.)
  # This generates 107 features from 4 raw features
  add_derived: true
  
  # Base features to extract from GPX files
  base_features:
  - cad      # Cadence (pedaling rate in RPM)
  - power    # Power output in watts
  - ele      # Elevation in meters
  
  # Moving average windows in seconds
  # These smooth out noise and capture sustained effort patterns
  moving_averages:
  - 5   # 5-second average (immediate effort)
  - 10  # 10-second average (short-term effort)
  - 30  # 30-second average (medium-term effort)
  - 60  # 60-second average (sustained effort)
  
  # Target variable to predict
  target: hr  # Heart rate in beats per minute

# Logging Configuration
# --------------------
logging:
  # Log file path for pipeline execution
  file: output/pipeline.log
  
  # Logging level (DEBUG, INFO, WARNING, ERROR)
  level: INFO

# Model-Specific Configurations
# -----------------------------
models:
  # Elastic Net: L1+L2 regularized linear regression
  elastic_net:
    # Regularization strength (higher = more regularization)
    alpha: 1.0
    
    # Balance between L1 (Lasso) and L2 (Ridge)
    # 0.0 = Ridge only, 1.0 = Lasso only, 0.5 = equal mix
    l1_ratio: 0.5
    
    # Whether to normalize features before training
    normalize: true
  
  # Ensemble: Weighted combination of Random Forest and XGBoost
  ensemble:
    # Whether to normalize features (not needed for tree-based models)
    normalize: false
    
    # Random Forest parameters for ensemble
    rf_max_depth: 15              # Maximum tree depth
    rf_max_features: sqrt          # Features to consider at each split
    rf_min_samples_leaf: 2         # Minimum samples in leaf nodes
    rf_min_samples_split: 5        # Minimum samples to split a node
    rf_n_estimators: 200           # Number of trees in forest
    rf_weight: 0.85                # Weight for RF predictions (85%)
    
    # XGBoost parameters for ensemble
    xgb_colsample_bytree: 0.8     # Feature sampling ratio per tree
    xgb_learning_rate: 0.1         # Step size shrinkage
    xgb_max_depth: 8               # Maximum tree depth
    xgb_n_estimators: 150          # Number of boosting rounds
    xgb_subsample: 0.8             # Sample ratio for training
    xgb_weight: 0.15               # Weight for XGB predictions (15%)
  
  # Lasso: L1 regularized linear regression
  lasso:
    # Range for alpha hyperparameter tuning
    alpha_range:
    - 0.001  # Minimum alpha (less regularization)
    - 10     # Maximum alpha (more regularization)
    normalize: true
  
  # OLS: Ordinary Least Squares (basic linear regression)
  ols:
    # No regularization, serves as baseline
    normalize: false
  
  # Random Forest: CHAMPION MODEL (1.17 bpm MAE after optimization)
  random_forest:
    # Optimized hyperparameters (achieved <2.0 bpm target)
    max_depth: 20              # Maximum tree depth (deeper = more complex)
    min_samples_leaf: 1        # Minimum samples in leaf (1 = no restriction)
    min_samples_split: 3       # Minimum samples to split (lower = more splits)
    n_estimators: 200          # Number of trees (more = better but slower)
    normalize: false           # Not needed for tree-based models
  
  # Ridge: L2 regularized linear regression
  ridge:
    # Regularization strength (10.0 = moderate regularization)
    alpha: 10.0
    normalize: true
  
  # XGBoost: Gradient boosted trees
  xgboost:
    colsample_bytree: 0.8      # Feature sampling per tree
    learning_rate: 0.1         # Learning rate (eta in XGBoost)
    max_depth: 6               # Maximum tree depth
    n_estimators: 200          # Number of boosting rounds
    normalize: false           # Not needed for tree-based models
    subsample: 0.8             # Row sampling ratio

# Output Configuration
# -------------------
output:
  # Compression for parquet files (snappy is fast, gzip is smaller)
  compression: snappy
  
  # Whether to create HTML report with results
  create_report: true
  
  # Report format (html, pdf, or markdown)
  report_format: html
  
  # File format for saving data (parquet, csv, or both)
  save_format: parquet

# Performance Configuration
# ------------------------
performance:
  # Chunk size for processing large files (if memory limited)
  chunk_size: 10000
  
  # Number of parallel jobs (-1 = use all CPU cores)
  n_jobs: -1
  
  # Whether to cache intermediate results for faster reruns
  use_cache: true

# Data Splitting Configuration
# ---------------------------
split:
  # Random seed for reproducibility
  random_state: 42
  
  # Whether to shuffle data before splitting
  # Note: Be careful with time-series data
  shuffle: true
  
  # Fraction of data for testing (0.2 = 20%)
  test_size: 0.2
  
  # Fraction of training data for validation (0.1 = 10%)
  validation_size: 0.1

# Training Configuration
# ---------------------
training:
  # Number of cross-validation folds
  cv_folds: 5
  
  # Models to train (comment out any to skip)
  models:
  - ols           # Baseline linear regression
  - ridge         # L2 regularized
  - elastic_net   # L1+L2 regularized
  - random_forest # Best performer (1.17 bpm MAE)
  - xgboost       # Gradient boosting (3.12 bpm MAE)
  - ensemble      # Weighted RF+XGB (2.36 bpm MAE)
  
  # Whether to perform hyperparameter tuning
  tune_hyperparameters: true
  
  # Number of trials for hyperparameter search
  tuning_trials: 50

