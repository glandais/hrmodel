# HR Model Pipeline Configuration

# Data paths
data:
  gpx_dir: "gpx"
  output_dir: "output"
  processed_data_dir: "output/processed_data"
  # Model-specific outputs will be organized as: output/{model_name}/
  model_output_pattern: "output/{model_name}"

# Feature engineering
features:
  # Moving average windows (in seconds)
  moving_averages:
    - 5
    - 10
    - 30
    - 60
  
  # Features to use for modeling
  base_features:
    - cad
    - power
    - ele
  
  # Derived features
  add_derived: true
  add_hr_zones: false
  
  # Target variable
  target: "hr"

# Data splitting
split:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  shuffle: true

# Model training
training:
  # Models to train
  models:
    - ols
    - ridge
    - lasso
    - random_forest
    - xgboost
  
  # Cross-validation
  cv_folds: 5
  
  # Hyperparameter tuning
  tune_hyperparameters: true
  tuning_trials: 50

# Model-specific configurations
models:
  ols:
    normalize: false
  
  ridge:
    alpha_range: [0.001, 100]
    normalize: true
  
  lasso:
    alpha_range: [0.001, 10]
    normalize: true
  
  random_forest:
    n_estimators: [50, 100, 200]
    max_depth: [5, 10, 20, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  
  xgboost:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.1, 0.3]
    subsample: [0.7, 0.8, 0.9]

# Evaluation
evaluation:
  metrics:
    - mae
    - rmse
    - mape
    - r2
    - correlation
  
  # Primary metric for model selection
  primary_metric: "mae"
  
  # Create visualizations
  create_plots: true
  
  # Save predictions
  save_predictions: true

# Output
output:
  # File formats
  save_format: "parquet"  # parquet, csv, or both
  
  # Compression
  compression: "snappy"
  
  # Reports
  create_report: true
  report_format: "html"  # html, pdf, or markdown

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "output/pipeline.log"

# Performance
performance:
  # Parallel processing
  n_jobs: -1  # -1 uses all cores
  
  # Memory optimization
  chunk_size: 10000  # Process data in chunks if needed
  
  # Cache intermediate results
  use_cache: true