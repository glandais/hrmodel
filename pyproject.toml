[project]
name = "hrmodel"
version = "1.0.0"
description = "Heart rate prediction from cycling data using machine learning"
authors = [{name = "HR Model Team"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core dependencies (required for main models)
    "gpxpy>=1.6.2",
    "pandas>=2.3.1",
    "numpy>=2.3.2",
    "scikit-learn>=1.7.1",
    "xgboost>=3.0.4",
    "lightgbm>=4.6.0",
    "pyarrow>=21.0.0",
    "joblib>=1.5.1",
    "matplotlib>=3.10.5",
    "seaborn>=0.13.2",
    "pyyaml>=6.0.2",
    "statsmodels>=0.14.5",
    "prophet>=1.1.7",
]

[project.optional-dependencies]
timeseries = [
    # Time-series models (these failed in our testing but available for research)
    "torch>=2.8.0",
]

all = [
    "hrmodel[timeseries]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
